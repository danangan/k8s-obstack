namespace:
  name: obstack

# Where the central components run (not the node collector, which runs on every node).
# Empty = any node. To pin them to a dedicated node group, e.g. one labeled workload=obstack
# and tainted dedicated=obstack:NoSchedule:
#   nodeSelector:
#     workload: obstack
#   tolerations:
#     - key: dedicated
#       operator: Equal
#       value: obstack
#       effect: NoSchedule
placement:
  nodeSelector: {}
  tolerations: []
  affinity: {}

storage:
  className: obstack-gp3
  storageClass:
    create: true
    name: obstack-gp3
    # On AWS EKS auto mode this should be ebs.csi.eks.amazonaws.com
    provisioner: ebs.csi.aws.com
    reclaimPolicy: Retain
    parameters:
      type: gp3
      encrypted: "true"


otelCollector:
  image: otel/opentelemetry-collector-k8s:0.160.0
  debug: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

otelClusterCollector:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

prometheus:
  image: prom/prometheus:v3.13.3
  retention:
    time: 15d
    size: 45GB
  persistence:
    size: 50Gi
    storageClassName: ""
  podSecurityContext:
    fsGroup: 65534
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi

loki:
  image: grafana/loki:3.7.8
  retention: 336h
  persistence:
    size: 50Gi
    storageClassName: ""
  podSecurityContext:
    fsGroup: 10001
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

tempo:
  image: grafana/tempo:3.0.3
  retention: 168h
  persistence:
    size: 50Gi
    storageClassName: ""
  podSecurityContext:
    fsGroup: 10001
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi


grafana:
  image: grafana/grafana:13.2.2
  anonymousAdmin: false
  adminPasswordSecret:
    create: true
    name: grafana-admin
    key: admin-password
  # grafana.ini settings as {section: {key: value}}, e.g. to add single sign-on.
  # See https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
  # This will be injected to the pods as ConfigMap
  config: {}
  # Extra environment for the Grafana container, e.g. a Secret holding
  # GF_AUTH_<PROVIDER>_CLIENT_SECRET. GF_<SECTION>_<KEY> variables override config.
  envFrom: []
  plugins:
    - grafana-lokiexplore-app
    - grafana-exploretraces-app
  persistence:
    size: 10Gi
    storageClassName: ""
  podSecurityContext:
    fsGroup: 472
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

ingress:
  enabled: true
  ingressClassName: alb
  grafanaHost: ""
  # Ingress annotations; for the ALB controller they configure the load balancer.
  # See https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/ingress/annotations/
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
