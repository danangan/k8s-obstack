namespace:
  name: obstack

placement:
  nodeSelector:
    workload: obstack
  tolerations:
    - key: dedicated
      operator: Equal
      value: obstack
      effect: NoSchedule
  affinity: {}

storage:
  className: obstack-gp3
  storageClass:
    create: true
    name: obstack-gp3
    provisioner: ebs.csi.aws.com
    reclaimPolicy: Retain
    parameters:
      type: gp3
      encrypted: "true"

# Sizes below suit a small-to-medium cluster. On the dedicated node group the stack requests
# ~2 CPU / 5 GiB and is limited to 8 CPU / 19.5 GiB, so a 4 vCPU / 32 GiB memory-optimized
# node (e.g. r7g.xlarge, or r7i.xlarge on x86) fits it with headroom. Raise Prometheus's
# memory first as the cluster grows: it scales with the number of active series.

# Node collector (DaemonSet): runs on every node, including application nodes, so this is a
# per-node cost. Load scales with that node's log and span volume. The memory request covers
# a busy node (pods using more than they request are evicted first under memory pressure);
# the CPU limit keeps a spike from taking CPU away from the node's applications.
otelCollector:
  image: otel/opentelemetry-collector-k8s:0.160.0
  debug: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Cluster collector (single replica): scales with the number of objects in the cluster.
otelClusterCollector:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

prometheus:
  image: prom/prometheus:v3.13.3
  retention:
    time: 15d
    size: 45GB
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: ""
  podSecurityContext:
    fsGroup: 65534
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi

loki:
  image: grafana/loki:3.7.8
  retention: 336h
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: ""
  podSecurityContext:
    fsGroup: 10001
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

tempo:
  image: grafana/tempo:3.0.3
  retention: 168h
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: ""
  podSecurityContext:
    fsGroup: 10001
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi


grafana:
  image: grafana/grafana:13.2.2
  anonymousAdmin: false
  adminPasswordSecret:
    # Create it with a random password, reused on every upgrade and kept on `helm uninstall`
    # (Grafana only reads the password when its database is first created). Read it with
    #   kubectl -n obstack get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
    # Set false to provide your own Secret with this name and key.
    create: true
    name: grafana-admin
    key: admin-password
  plugins:
    - grafana-lokiexplore-app
    - grafana-exploretraces-app
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  podSecurityContext:
    fsGroup: 472
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

ingress:
  enabled: true
  ingressClassName: alb
  grafanaHost: ""
  # Ingress annotations; for the ALB controller they configure the load balancer.
  # See https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/ingress/annotations/
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
