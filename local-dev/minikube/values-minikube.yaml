# Local development on minikube. Layered on top of the chart's values.yaml (the AWS
# production defaults) by local-dev/minikube/deploy-obstack.sh, which runs (from the repo root)
#   helm upgrade --install obstack . -f local-dev/minikube/values-minikube.yaml
# Excluded from the published chart package by the root .helmignore (local-dev/).

# No dedicated node: run on the single minikube node. (`null` removes the default map key;
# an empty map would be merged with the defaults and keep them.)
placement:
  nodeSelector: null
  tolerations: []

# No EBS: don't create the gp3 StorageClass. The volumes use minikube's default `standard`
# StorageClass instead: directories on the node, which keep data across pod restarts but
# can't be resized.
storage:
  className: ""
  storageClass:
    create: false

prometheus:
  retention:
    time: 7d
    size: 2GB
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 216Mi

loki:
  retention: 168h
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

tempo:
  retention: 168h
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  # No login screen; anonymous users are admins.
  anonymousAdmin: true
  persistence:
    size: 1Gi

# Exposed through minikube's ingress-nginx addon instead of an AWS ALB; *.localtest.me
# resolves to 127.0.0.1. `annotations: null` drops the default ALB annotations.
ingress:
  ingressClassName: nginx
  grafanaHost: grafana.localtest.me
  annotations: null
