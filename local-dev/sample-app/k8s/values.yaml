image:
  repository: sample-app
  tag: latest
  # Never: build-and-deploy.sh builds the image straight into minikube.
  pullPolicy: Never

ingress:
  enabled: true
  className: nginx
  host: app.localtest.me

# Fraction of POST /orders requests that fail with a simulated error (0.0-1.0).
orderFailureRate: 0.2
logLevel: INFO
