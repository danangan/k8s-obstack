{{- if .Values.gpu.enabled }}
# NVIDIA DCGM Exporter: GPU metrics on :9400, scraped by the node collector on the same node.
# Based on the upstream chart: https://github.com/NVIDIA/dcgm-exporter/tree/main/deployment
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: dcgm-exporter
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
    spec:
      automountServiceAccountToken: false
      {{- with .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dcgm-exporter
          image: {{ .Values.gpu.image }}
          resources:
            {{- toYaml .Values.gpu.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              # Needed for the profiling metrics (DCGM_FI_PROF_*).
              add: [SYS_ADMIN]
              drop: [ALL]
          env:
            # Label each GPU's metrics with the pod, namespace and container using it.
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
            # Sets the `Hostname` label to the node name.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9400
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
          volumeMounts:
            # The kubelet's record of which pod has which GPU.
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
      volumes:
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
{{- end }}
