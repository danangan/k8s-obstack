apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: loki
spec:
  replicas: 1
  # One pod at a time: a ReadWriteOnce volume can't be attached to the old and new pod at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      annotations:
        # Roll the pod when the ConfigMap changes; Loki doesn't reload on its own.
        checksum/config: {{ include (print $.Template.BasePath "/loki/loki-configmap.yaml") . | sha256sum }}
    spec:
      # Pin to the dedicated obstack node group (placement.* values).
      {{- with .Values.placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loki.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ $.Values.namespace.name }}
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: {{ $.Values.namespace.name }}
  annotations:
    # Keep the claim, and so the volume and its data, on `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with (.Values.loki.persistence.storageClassName | default .Values.storage.className) }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.loki.persistence.size }}
