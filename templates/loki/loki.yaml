apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: loki
spec:
  replicas: 1
  # One pod at a time: a ReadWriteOnce volume can't be attached to the old and new pod at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      annotations:
        # Roll the pod when the ConfigMap changes; Loki doesn't reload on its own.
        checksum/config: {{ include (print $.Template.BasePath "/loki/loki-config.yaml") . | sha256sum }}
    spec:
      {{- include "obstack.placement" . | nindent 6 }}
      {{- with .Values.loki.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        {{- include "obstack.dataVolume" (dict "name" "loki" "persistence" .Values.loki.persistence) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ $.Values.namespace.name }}
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
{{- with (include "obstack.pvc" (dict "root" $ "name" "loki" "persistence" .Values.loki.persistence)) }}
---
{{ . }}
{{- end }}
