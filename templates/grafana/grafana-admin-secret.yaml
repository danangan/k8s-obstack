{{- if and (not .Values.grafana.anonymousAdmin) .Values.grafana.adminPasswordSecret.create }}
{{- $namespace := .Values.namespace.name }}
{{- $name := .Values.grafana.adminPasswordSecret.name }}
{{- $key := .Values.grafana.adminPasswordSecret.key }}
{{- /* Reuse the password on upgrades: generating a new one would lock the admin out, since
       Grafana only reads it when its database is first created. */}}
{{- $password := randAlphaNum 32 | b64enc }}
{{- with (lookup "v1" "Secret" $namespace $name) }}
{{- with (index .data $key) }}
{{- $password = . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    # Keep the password with Grafana's (persistent) database on `helm uninstall`.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $password }}
{{- end }}
