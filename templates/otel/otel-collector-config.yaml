apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ $.Values.namespace.name }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      kubelet_stats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
      # Host-level metrics (node-exporter equivalent), read from the node's
      # root filesystem mounted at /hostfs. No `network` scraper: /proc/net
      # resolves to this pod's network namespace, not the node's; kubelet_stats
      # already reports node network I/O.
      host_metrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu: {}
          load: {}
          memory: {}
          paging: {}
          disk: {}
          filesystem:
            include_virtual_filesystems: true
            exclude_fs_types:
              match_type: strict
              fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, mqueue, nsfs, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tracefs, tmpfs]
            exclude_mount_points:
              match_type: regexp
              mount_points: ["^/dev(/.*)?$", "^/proc(/.*)?$", "^/sys(/.*)?$", "^/run(/.*)?$", "^/var/lib/containerd/.*", "^/var/lib/kubelet/.*", "^/var/lib/docker/.*", "^/etc/.*"]
      # Pod stdout/stderr, tailed from the node's CRI log files
      # (/var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log).
      file_log:
        include: [/hostfs/var/log/pods/*/*/*.log]
        # Skip this collector's own logs so the debug exporter can't feed back into itself.
        exclude: [/hostfs/var/log/pods/{{ $.Values.namespace.name }}_otel-collector-*/*/*.log]
        # Files present when the collector first starts are read from the end:
        # Loki rejects lines more than ~1h older than a stream's newest entry,
        # so replaying old history only produces errors. Files that appear later
        # (new pods) are read from the start, and the checkpoint covers restarts.
        start_at: end
        include_file_path: true
        include_file_name: false
        # Checkpoint read offsets so a restart resumes instead of re-sending everything.
        storage: file_storage
        operators:
          # Parses the CRI line format (time, stream, partial-line flag) and sets
          # k8s.namespace.name, k8s.pod.name, k8s.pod.uid and k8s.container.name from the path.
          - type: container
            id: container-parser
          # Structured logs: for lines that are a JSON object, lift the fields into log
          # attributes, map `level` to the log severity and use `message` as the body.
          # Non-JSON lines pass through untouched.
          - type: json_parser
            id: json-parser
            if: 'body matches "^\\s*\\{"'
            parse_from: body
            parse_to: attributes
            on_error: send_quiet
            severity:
              parse_from: attributes.level
              mapping:
                warn: [warn, warning]
                fatal: [fatal, critical]
          - type: move
            id: json-message-to-body
            if: 'attributes.message != nil'
            from: attributes.message
            to: body
          - type: remove
            id: json-drop-level
            if: 'attributes.level != nil'
            field: attributes.level
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      # Enrich telemetry with k8s metadata looked up from the API server.
      k8s_attributes:
        auth_type: serviceAccount
        # DaemonSet: only watch pods on this collector's node.
        filter:
          node_from_env_var: K8S_NODE_NAME
        # Workloads send via the node's hostPort, so the connection IP isn't
        # reliably the pod's; prefer the pod UID the app reports itself.
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.node.uid
            - k8s.deployment.name
      # host_metrics has no k8s identity of its own; tag it with the node.
      resource/node:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
    exporters:
      {{- if .Values.otelCollector.debug}}
      debug: {}
      {{- end }}    
      otlp_http/prometheus:
        endpoint: http://prometheus.{{ $.Values.namespace.name }}.svc.cluster.local:9090/api/v1/otlp
      otlp_grpc/tempo:
        endpoint: tempo.{{ $.Values.namespace.name }}.svc.cluster.local:4317
        tls:
          insecure: true
      otlp_http/loki:
        endpoint: http://loki.{{ $.Values.namespace.name }}.svc.cluster.local:3100/otlp
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      # On a hostPath so offsets survive collector restarts.
      file_storage:
        directory: /var/lib/otelcol/file_storage
        create_directory: true
    service:
      extensions: [health_check, file_storage]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [{{ if .Values.otelCollector.debug }}debug, {{ end }}otlp_http/prometheus]
        # Infrastructure metrics collected by this node's collector.
        metrics/node:
          receivers: [kubelet_stats, host_metrics]
          processors: [memory_limiter, resource/node, k8s_attributes, batch]
          exporters: [{{ if .Values.otelCollector.debug }}debug, {{ end }}otlp_http/prometheus]
        # Pod logs from disk, plus any logs apps send over OTLP.
        logs:
          receivers: [file_log, otlp]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [{{ if .Values.otelCollector.debug }}debug, {{ end }}otlp_http/loki]
        # Spans apps send over OTLP, tagged with the same k8s metadata as their metrics and logs.
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [{{ if .Values.otelCollector.debug }}debug, {{ end }}otlp_grpc/tempo]
