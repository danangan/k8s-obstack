apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: prometheus
spec:
  replicas: 1
  # One pod at a time: a ReadWriteOnce volume can't be attached to the old and new pod at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # Roll the pod when the ConfigMap changes; Prometheus doesn't reload on its own.
        checksum/config: {{ include (print $.Template.BasePath "/prometheus/prometheus-configmap.yaml") . | sha256sum }}
    spec:
      # Pin to the dedicated obstack node group (placement.* values).
      {{- with .Values.placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prometheus.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --web.enable-otlp-receiver
            # Tempo's metrics generator pushes span-metrics / service-graph series here.
            - --web.enable-remote-write-receiver
            # Keep trace-ID exemplars on histograms so Grafana can jump from a metric to a trace.
            - --enable-feature=exemplar-storage
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention.time }}
            {{- with .Values.prometheus.retention.size }}
            # Keep this below persistence.size so the oldest data is dropped before the disk fills.
            - --storage.tsdb.retention.size={{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ $.Values.namespace.name }}
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: {{ $.Values.namespace.name }}
  annotations:
    # Keep the claim, and so the volume and its data, on `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with (.Values.prometheus.persistence.storageClassName | default .Values.storage.className) }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
