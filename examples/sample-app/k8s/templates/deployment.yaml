apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels: 
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: sample-app
  template:
    metadata:
      labels: 
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: sample-app:latest
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
          imagePullPolicy: Never   # image is built into minikube's docker daemon
          ports:
            - containerPort: 8000
          env:
            # The collector runs as a DaemonSet with hostPorts (no Service), so target the node IP.
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4318
            - name: OTEL_SERVICE_NAME
              value: sample-app
            # Lets the collector's k8sattributes processor match telemetry to this pod.
            - name: K8S_POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.uid=$(K8S_POD_UID)
            # Fraction of POST /orders requests that fail with a simulated error.
            - name: ORDER_FAILURE_RATE
              value: {{ .Values.orderFailureRate | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          readinessProbe:
            httpGet: 
              path: /healthz
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
spec:
  selector:
    app: sample-app
  ports:
    - port: 80
      targetPort: 8000
