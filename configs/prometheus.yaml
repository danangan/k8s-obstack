global:
  scrape_interval: 15s
# OTLP resource attributes only land on target_info by default
# (service.name becomes `job`); promote these onto every series.
otlp:
  promote_resource_attributes:
    - service.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.pod.uid
    - k8s.node.name
    - k8s.node.uid
    - k8s.deployment.name
    - k8s.container.name
    - k8s.replicaset.name
    - k8s.daemonset.name
    - k8s.statefulset.name
    - k8s.job.name
    - k8s.cronjob.name
# Application, node and cluster metrics are all pushed by the otel
# collectors via OTLP, so the only scrape target is Prometheus itself.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
