# Single-binary Tempo (`-target=all`) with local storage.
# Traces arrive from the otel collector over OTLP/gRPC.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
# Derives RED metrics (span-metrics) and service-to-service edges (service-graphs)
# from traces and remote-writes them, with trace exemplars, to Prometheus.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus.{{ $.Values.namespace.name }}.svc.cluster.local:9090/api/v1/write
        send_exemplars: true
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
usage_report:
  reporting_enabled: false
