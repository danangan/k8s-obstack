# Single-binary ("monolithic") Loki with local filesystem storage.
# Logs arrive from the otel collector on Loki's native OTLP endpoint (/otlp).
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  # OTLP resource/log attributes that aren't index labels are kept as
  # structured metadata, so they're still filterable in LogQL.
  allow_structured_metadata: true
  volume_enabled: true
  # How long logs are kept; enforced by the compactor below.
  retention_period: {{ .Values.loki.retention }}
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
# Detects recurring log line patterns for Logs Drilldown's Patterns tab.
pattern_ingester:
  enabled: true
analytics:
  reporting_enabled: false
